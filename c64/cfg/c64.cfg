# ld65 config for HOPPER (C64)
#
# One .prg loading at $0801: the BASIC stub, then the game image (GAME,
# assembled to run at $0500, its Oric address, and moved there by Start),
# then the platform code from $3400, above the game's font save area
# ($3100-$33FF), up to $8000. VIC bank 2 ($8000-$BFFF) holds the VIC screen,
# the character sets, the hi-scores and the Oric screen. Enhanced data that
# doesn't fit below $8000 goes in HIGH at $9000-$9FFF, which the VIC can't use
# in bank 2 (it sees the character ROM there). The file covers $8000-$8FFF on
# the way (GAP, zeros): harmless, since that is all written at run time.

MEMORY {
    ZP:       file = "",  start = $0060, size = $0070;
    LOADADDR: file = %O, start = $07FF, size = $0002;
    STUB:     file = %O, start = $0801, size = $000F, fill = yes;
    GAMELOAD: file = %O, start = $0810, size = $3400 - $0810, fill = yes;
    GAMERUN:  file = "",  start = $0500, size = $2BD5;
    MAIN:     file = %O, start = $3400, size = $8000 - $3400, fill = yes;
    GAP:      file = %O, start = $8000, size = $1000, fill = yes;
    HIGH:     file = %O, start = $9000, size = $1000;
}

SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = STUB,     type = ro;
    GAME:     load = GAMELOAD, run = GAMERUN, type = rw, define = yes;
    CODE:     load = MAIN,     type = rw;
    RODATA:   load = MAIN,     type = ro;
    BSS:      load = MAIN,     type = bss, define = yes;
    HIDATA:   load = HIGH,     type = ro;
}
